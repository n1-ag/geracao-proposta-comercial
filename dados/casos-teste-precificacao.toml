# =============================================================================
# Suíte golden da precificação
#
# Os valores esperados foram escritos À MÃO, a partir das regras — não copiados
# da saída do script. É isso que torna a suíte um teste, e não um espelho.
#
# Rodar:  python3 scripts/auditar.py precos
# O orquestrador roda esta suíte ANTES de aceitar a fase 03. Se algum caso
# falhar, o pipeline aborta: um preço errado é pior do que proposta nenhuma.
# =============================================================================

[meta]
versao = "2026.1"
regra = """
receita_anual_alvo = valor_implantacao × 1,3
mensal_alvo        = receita_anual_alvo / 12
ponto fixo         = para cada faixa, h = mensal_alvo / valor_hora;
                     aceita a faixa em que h cai dentro dela mesma
desempate          = a que entrega mais horas
sem faixa          = piso (horas_min) da faixa superior
h_final            = round_half_up(h);  mensal_final = h_final × valor_hora
"""

