texto = "A Rosetta é a nossa IA interna, integrada ao Runrun.it e treinada em uma base de conhecimento de VTEX Legacy, VTEX IO, FastStore e anos de tarefas executadas pela N1. Ela faz as perguntas que faltam no briefing logo após a abertura, acelerando o refinamento — o que reduz de forma relevante o tempo de cotação. **O parecer final é sempre humano:** o gestor valida o entendimento antes de qualquer cotação seguir para aprovação. Nosso fluxo de desenvolvimento é híbrido, e a decisão técnica permanece com o time."
