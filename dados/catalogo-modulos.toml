# =============================================================================
# N1.AG — Catálogo de módulos
#
# O agente de escopo SÓ pode cotar itens que existam aqui. Item que não existe
# vai para `itens_fora_catalogo` no 02-escopo.json, o que dispara alerta visível
# no checkpoint — de propósito: é assim que o catálogo cresce com controle.
#
# As faixas são [mínimo, máximo] de horas. A política de qual extremo usar está
# em precos.toml (`politica_faixa_horas`, hoje "maximo").
#
# REVISE OS NÚMEROS. A primeira versão foi calibrada por ordem de grandeza, não
# por histórico de tarefas da N1.
#
# Depois de editar:  python3 scripts/auditar.py precos
# =============================================================================

[meta]
versao = "2026.1"
atualizado_em = "2026-08-13"

