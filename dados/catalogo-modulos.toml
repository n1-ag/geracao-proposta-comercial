[[itens]]
id = "analise-mapa-calor"
nome = "Análise de mapa de calor"
categoria = "apoio"
unidade = "estudo"
horas_baixa = [10, 14]
horas_media = [18, 24]
horas_alta = [30, 40]
criterio_complexidade = """
Cobre instrumentar, coletar e ler o comportamento real de quem usa o site — mapa de calor, mapa de cliques, rolagem e gravação de sessão. Não inclui executar as correções que o estudo apontar: isso é relayout, ou entra no pacote de evolução.
baixa: ferramenta já instalada pelo cliente, leitura de 2 a 3 páginas-chave;
media: instrumentação da ferramenta, janela de coleta definida e leitura das páginas do funil;
alta: eventos personalizados, segmentação por dispositivo e origem, gravação de sessão e leitura do funil inteiro."""
descricao_proposta = "Instrumentação e leitura de mapa de calor, rolagem e gravação de sessão."

[[itens]]
id = "estudo-navegacao-plano-acoes"
nome = "Estudo de navegação e plano de ações"
categoria = "apoio"
unidade = "estudo"
horas_baixa = [10, 14]
horas_media = [18, 26]
horas_alta = [30, 42]
criterio_complexidade = """
Auditoria da navegação e da usabilidade que termina num plano de ações priorizado — o que corrigir, em que ordem e por quê. É o documento que orienta o relayout ou as sprints de evolução; a execução é cotada à parte.
baixa: auditoria heurística das páginas do funil e plano com prioridades;
media: auditoria, benchmark de concorrentes e plano priorizado por impacto e esforço, com wireframes de referência;
alta: acima, com validação pelos dados de comportamento e árvore de navegação redesenhada."""
descricao_proposta = "Auditoria de navegação com plano de ações priorizado por impacto e esforço."


[[itens]]
id = "correcao-defeito-componente"
nome = "Correção de defeito em componente existente"
categoria = "apoio"
unidade = "correção"
horas_baixa = [1, 2]
horas_media = [3, 5]
horas_alta = [6, 10]
criterio_complexidade = """
baixa: causa isolada dentro do próprio componente (ex.: fórmula, CSS, timing de animação), sem depender de dado externo — corrige-se lendo e ajustando o código já existente;
media: o valor ou comportamento errado depende de como o componente lê ou calcula um dado (ex.: contador, card, banner puxando de API/CMS/estado interno do site), exigindo rastrear a origem do dado antes de corrigir;
alta: defeito se repete em mais de um componente, depende de integração externa (ERP, CRM, API de terceiro) cujo contrato mudou ou falhou, ou é intermitente e exige reproduzir o erro antes de saber a causa"""
descricao_proposta = "Correção do funcionamento de um componente já existente no site que estava apresentando comportamento incorreto."

[[itens]]
id = "ajuste-pontual-navegacao"
nome = "Ajuste pontual de navegação em site existente"
categoria = "apoio"
unidade = "ajuste"
horas_baixa = [1, 2]
horas_media = [2, 4]
horas_alta = [4, 6]
criterio_complexidade = """
baixa: inclusão ou alteração de um link em um único elemento de navegação (ex.: apenas o menu principal), sem ícone, destaque visual ou tradução, em site com estrutura de menu simples;
media: o mesmo ajuste replicado em mais de um elemento de navegação (ex.: menu principal e rodapé), ou dentro de um menu com submenus, sem exigir componente visual novo;
alta: ajuste em múltiplos elementos de navegação com variação por idioma/moeda, comportamento próprio no menu mobile, ou que dependa de aprovação de UX por afetar a estrutura de um mega menu já carregado"""
descricao_proposta = "Inclusão do link da página de Cases nos menus e demais pontos de navegação do site."
